<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>内容资料储备库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="跨境营销、AI工具实操与数字出海干货库">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 引入现代感主题（Themeable Vue 风格） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <style>
    /* 自定义品牌配色与动态效果 */
    :root {
      --theme-color: #2563eb; /* 优雅宝蓝色 */
      --sidebar-width: 280px;
      --content-max-width: 900px;
    }

    /* 侧边栏菜单鼠标悬停平移效果 */
    .sidebar-nav li a {
      transition: all 0.2s ease;
    }
    .sidebar-nav li a:hover {
      transform: translateX(6px);
      color: var(--theme-color) !important;
    }

    /* 全局链接悬停特效 */
    .markdown-section a:hover {
      text-decoration: underline;
      transition: all 0.2s ease;
    }

    /* 页面平滑滚动 */
    html {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body>
  <div id="app">加载中...</div>

  <script>
    window.$docsify = {
      name: '<b>内容资料储备库</b>',
      repo: '', // 可填入你的 GitHub 仓库地址，或留空
      loadSidebar: true,  // 开启侧边栏导航 (_sidebar.md)
      loadNavbar: true,   // 开启顶部菜单栏 (_navbar.md)
      coverpage: true,    // 开启全屏封面 (_coverpage.md)
      auto2top: true,     // 切换页面时自动回到顶部
      subMaxLevel: 3,     // 抓取文章 2~3 级标题显示在侧边栏
      
      // 全文搜索插件配置
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 搜索文档/干货...',
        noData: '😞 未找到相关内容',
        depth: 6
      },

      // 代码块一键复制配置
      copyCode: {
        buttonText: '复制',
        errorText: '错误',
        successText: '已复制'
      }
    }
  </script>

  <!-- Docsify 核心脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 现代主题核心 JS -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>
  
  <!-- 实用高级插件 -->
  <!-- 1. 全文搜索 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- 2. 代码一键复制 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <!-- 3. 图片点击全屏平滑放大 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <!-- 4. 代码高亮强化 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
</body>
</html>
