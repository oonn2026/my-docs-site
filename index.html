<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Web3 投研与加密资产智库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 引入高端 Web3 专属英文字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- 引入 Docsify 暗黑主题 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

  <style>
    /* =========================================
       高端字体与 Web3 质感 UI 系统
       ========================================= */
    :root {
      --theme-color: #FCD535; /* 经典机构金/币安黄 */
      --text-color: #EAECEF;
      --bg-color: #0B0E11;    /* 深邃交易黑 */
      --card-bg: #181A20;
      --glass-border: rgba(255, 255, 255, 0.05);
      --hover-glow: rgba(252, 213, 53, 0.15);
    }

    /* 全局排版与字体优化 */
    body {
      background-color: var(--bg-color) !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-color);
      line-height: 1.7;
      letter-spacing: 0.3px; /* 增加呼吸感 */
    }

    /* 标题采用极客几何字体 Space Grotesk */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Space Grotesk', sans-serif !important;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    /* 侧边栏深度定制 */
    .sidebar {
      background: var(--bg-color) !important;
      border-right: 1px solid var(--glass-border);
    }
    .sidebar-nav li a {
      color: #848E9C !important;
      font-size: 14px;
      transition: all 0.3s ease;
      border-radius: 4px;
      padding: 10px 16px;
      margin: 4px 10px;
    }
    .sidebar-nav li a:hover, .sidebar-nav li.active > a {
      color: #FFF !important;
      background: var(--card-bg);
      transform: translateX(6px);
      box-shadow: -2px 0 0 var(--theme-color);
    }

    /* 页面平滑加载动画 */
    .markdown-section {
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      max-width: 850px;
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* 机构级质感卡片 */
    .pro-card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .pro-card {
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 28px;
      transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
      cursor: pointer;
      text-decoration: none !important;
      display: block;
      color: var(--text-color) !important;
    }
    .pro-card:hover {
      transform: translateY(-5px);
      border-color: var(--theme-color);
      box-shadow: 0 10px 30px var(--hover-glow);
    }
    .pro-card h3 {
      margin-top: 0;
      color: #FFF;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pro-card p {
      color: #848E9C;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 0;
    }

    /* 隐藏默认封面遮罩 */
    .cover { background: transparent !important; }
  </style>
</head>
<body>
  <div id="app">节点连接中...</div>

  <script>
    window.$docsify = {
      name: '<b style="font-family: \'Space Grotesk\'; color: #FFF; letter-spacing: 1px;">WEB3 <span style="color: #FCD535;">RESEARCH</span></b>',
      loadSidebar: true,
      loadNavbar: true,
      coverpage: true,
      auto2top: true,
      subMaxLevel: 2,
      
      search: {
        placeholder: '检索链上数据或研报...',
        noData: '未在区块中找到相关记录'
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
</body>
</html>
